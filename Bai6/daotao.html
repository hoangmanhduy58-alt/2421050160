<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đào tạo - HUMG</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Menu trên -->
    <nav class="danh-muc">
        <ul class="danh-sach-muc">
            <li><a class="lienket" href="#">Thực tập, Đồ án</a></li>
            <li><a class="lienket" href="#">Thủ tục Một cửa</a></li>
            <li><a class="lienket" href="#">Một cửa online</a></li>
            <li><a class="lienket" href="#">E-mail HUMG</a></li>
        </ul>
    </nav>

    <main class="noi-dung-chinh">

        <!-- Cột trái -->
        <aside class="trai">

            <!-- Form đăng nhập -->
            <form class="khoi-dang-nhap" action="#" method="post">

                <label for="taikhoan">Tài khoản</label>
                <input type="text" id="taikhoan" name="taikhoan">

                <label for="matkhau">Mật khẩu</label>
                <div class="mat-khau">
                    <input type="password" id="matkhau" name="matkhau" >
                </div>

                <a href="#" class="quen-mk">Quên mật khẩu?</a>

                <button type="submit" class="btn-dang-nhap">Đăng nhập</button>
                <button type="button" class="btn-microsoft">Đăng nhập với Microsoft office 365</button>

            </form>

        </aside>

        <!-- Cột phải -->
        <section class="phai">
            <div class="noi-dung-phai">
                <div class="tin">
                    <div class="chức năng-tin"></div>
                        <div class="tiêu đề-tin">Tin tức</div>
                        <div class="xem-tiep"><a class="lien-ket-xem-tiep" href="#">Xem tiếp</a></div>
                </div>
            <!-- Tin tức, thông báo sẽ thêm sau -->
        </section>

    </main>

</body>
</html>
