<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bai6</title>
    <style>
        .khoi1 {
            background-color: rgb(196, 19, 63); 
        }
        .khoi2 {
            background-color: rgb(224, 255, 49); 
            /* 1 gtri : cách đều xung quanh = giá trị đó */
            /* 2 gtri : giá trị đầu (trên dưới) = giá trị 2 (trái , phải) */
            /* 4gtri : theo thứ tự trên phải dưới trái */
            margin:50px 200px 10px 100px;
            /* độ lớn của thẻ */
            padding:50px ;
        }
        .khoi3 {
            background-color: rgb(247, 189, 30); 
        }
        .khoi4 {
            background-color: rgb(139, 138, 134); 
              display: flex; /*bỏ thảng block để linh hoạt hơn */
        }
        .khoi5 {
            background-color: rgb(252, 83, 53); 
            width :50%;
        }
        .khoi6 {
            background-color: rgb(30, 247, 41); 
            width :50%;

        }
    </style>
</head>
<body>
    <div class="khoi1"> khoi1</div>
    <div class="khoi2"> khoi2</div>
    <div class="khoi3"> khoi3</div>
    <div class="khoi4" >
        <div class="khoi5"> khoi5</div>
        <div class="khoi6"> khoi6</div>
    </div>
</body>
</html>
