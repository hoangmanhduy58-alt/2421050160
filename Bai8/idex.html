<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript</title>
</head>
<body>
    <div>
        <h1>Nhập điểm</h1>
    <div>
        <p>Điểm A: <input type="number" id="diemA" min="0" max="10" step="0.1" oninput="tinhDiemTong()"> <span class="chu" id="chuA"></span></p>
    </div>
    <div>
        <p>Điểm B: <input type="number" id="diemB" min="0" max="10" step="0.1" oninput="tinhDiemTong()"> <span class="chu" id="chuB"></span></p>
    </div>
    <div>
        <p>Điểm C: <input type="number" id="diemC" min="0" max="10" step="0.1" oninput="tinhDiemTong()"> <span class="chu" id="chuC"></span></p>
    </div>
    <button onclick="tinhDiemTong()">Tính điểm tổng</button>
    <div id="ketQuaTong">
    </div>
    <h2>Nhập năm sinh</h2>
    <div>
        <p>Năm sinh: <input type="number" id="namSinh" min="1900" max="2026" step="1" oninput="tinhTuoi()"> <span id="tuoi"></span></p>
    </div>
    <button onclick="tinhTuoi()">Tính tuổi</button>
    <div id="ketQuaTuoi">
    </div>

    <!-- internal Javascript -->
    <script>
        
        function tinhDiemTong(){
            var diemA = parseFloat(document.getElementById("diemA").value);
            var diemB = parseFloat(document.getElementById("diemB").value);
            var diemC = parseFloat(document.getElementById("diemC").value);
            document.getElementById("chuA").innerHTML = isNaN(diemA) ? "" : diemChu(diemA);
            document.getElementById("chuB").innerHTML = isNaN(diemB) ? "" : diemChu(diemB);
            document.getElementById("chuC").innerHTML = isNaN(diemC) ? "" : diemChu(diemC);
            if(isNaN(diemA) || isNaN(diemB) || isNaN(diemC)){
                document.getElementById("ketQuaTong").innerHTML = "";
                return;
            }
            if(diemA < 0 || diemA > 10 || diemB < 0 || diemB > 10 || diemC < 0 || diemC > 10){
                document.getElementById("ketQuaTong").innerHTML = "Điểm phải từ 0 đến 10";
                return "nhap lai diem A, B, C trong khoảng 0 đến 10";
            }
            var tong = diemA*0.6 + diemB*0.3 + diemC*0.1;
            document.getElementById("ketQuaTong").innerHTML = "Điểm A: " + diemA + "<br>Điểm B: " + diemB + "<br>Điểm C: " + diemC + "<br>Điểm tổng: " + tong + " - Điểm chữ: " + diemChu(tong);
        }
         function diemChu(diem){
            if(diem < 0 || diem > 10){
                return "Không hợp lệ";
            }else if(diem >= 9 && diem <= 10){
                return "A+";
            }else if(diem >= 8.5){
                return "A";
            }else if(diem >= 8){
                return "B+";
            }else if(diem >= 7){
                return "B";
            }else if(diem >= 6.5){
                return "C+";
            }else if(diem >= 5.5){
                return "C";
            }else if(diem >= 5){
                return "D+";
            }else if(diem >= 4){
                return "D";
            }else if(diem >= 0){
                return "F";
            }
            return "Không hợp lệ"; 
        }
        function tinhTuoi(){
            var namSinh = parseInt(document.getElementById("namSinh").value);
            var namNay = new Date().getFullYear();
            if(isNaN(namSinh)){
                document.getElementById("tuoi").innerHTML = "";
                document.getElementById("ketQuaTuoi").innerHTML = "";
                return;
            }
            if(namSinh < 1900 || namSinh > namNay){
                document.getElementById("tuoi").innerHTML = "Không hợp lệ";
                document.getElementById("ketQuaTuoi").innerHTML = "Năm sinh phải từ 1900 đến " + namNay;
                return;
            }
            var tuoi = namNay - namSinh;
            document.getElementById("tuoi").innerHTML = tuoi + " tuổi";
            document.getElementById("ketQuaTuoi").innerHTML = "Năm sinh: " + namSinh + "<br>Tuổi: " + tuoi;
        }
   </script>
    <!-- external Javascript -->
    <script src="script.js"></script>
</body>
</html>
