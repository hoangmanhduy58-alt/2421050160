<html>
    <head>
        <title>Bài4</title>
    </head>
    <body>
        <h1>Form tạo thông tin</h1>
        <form>
            <!-- input nếu ko truyền type thì
            type mặc định là text -->
            <div>
                Họ và tên: <input type="text" name="duyhoang">
            </div>
            <br>
            <div>
                Giới thiệu bản thân: <textarea name="GioiThieu"></textarea>
            </div>
            <div>
                Email: <input type="email" name="Email">
            </div>
            <div>
                <p><b>So dien thoai</b></p>
                <input type="tel" name="SoDienThoai"
                placeholder="Dang so 123"
                required
                pattern="[0]{1}[9368]{1}[0-9]{8}">
            </div>
            <div>
                <p><b>GioiTinh</b></p>
                <input type="radio" name="GioiTinh" value="male">Nam<br>
                <input type="radio" name="GioiTinh" value="female">Nu
            </div>
            <div>
                <p><b>SoThich</b></p>
                GAME<input type="checkbox" name="SoThich" value="GAME"><br>
                Music<input type="checkbox" name="SoThich" value="Music"><br>
               Sport<input type="checkbox" name="SoThich" value="Sport"><br>
            </div>
            </div>
            <div>
                <!-- list, datalist -->
                 <p><b>Trình duyệt web hay sử dụng </b></p>
                 <input list="browsers">
                 <datalist id="browsers">
                    <option value ="Internet Explorer">
                    <option value ="Firefox">
                    <option value ="Chrome">
                    <option value ="Opera">
                    <option value ="Opera">
                    <option value ="Opera">
                 </datalist>
                 <select name ="browsers">
                    <option value ="Internet Explorer">Internet Explorer</option>
                    <option value ="Firefox">Firefox</option>
                    <option value ="Chrome">Chrome</option>
                    <option value ="Opera">Opera</option>
                    <option value ="Opera">Safari</option>
                    <option value ="Opera">Cốc cốc</option>
            </div>
            <br>
                <div>
                    <br>
                    0 <input type="range" id="a" min="0" max="100" step="10">100
                </div>
            <div>
                <input type="submit">
                <button click="alert('Hello World')">Click me</button>
                <input type="reset">
            </div>
            <div>
                <iframe width="935" height="534" src="https://www.youtube.com/embed/J81DIuRnoPE" 
                title="(Talkshow) Phòng trà Yên Lãng trở lại với dàn ca sĩ vừa lạ vừa quen cùng màn biểu diễn đầy ngẫu hứng" 
                frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                referrerpolicy="strict-origin-when-cross-origin"
                allowfullscreen></iframe>
            </div>
            <div>
                <p><b>Audio</b></p>
                <audio controls>
                    <source src="/Anh/music.mp3" type="audio/mp3">
                    Trình duyệt của bạn không hỗ trợ thẻ audio.
                </audio>
                <video controls>
                    <source src="/Anh/1.mp4" type="video/mp4">
                    Trình duyệt của bạn không hỗ trợ thẻ audio.
                </video>
            </div>
        </form>
        <MARQUEE>
            <img src="/Anh/pug.jpg" width="100" height="100">
        </MARQUEE> 
    </body>
</html>
