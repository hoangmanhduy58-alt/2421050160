<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web phim</title>
    <style>
        body {
            color: #fff;
            background: #2F2C38;
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
        }
        .danh-sach-muc {
            list-style: none;
            display: flex;
            gap: 20px;
            align-items: center;
            padding: 0;
            margin: 0;
            flex-wrap: wrap;
        }
        .lien-ket-muc {
            color: #fff;
            text-decoration: none;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
        }
        .muc {
            padding: 10px;
            border-radius: 25px;
        }
        .muc:hover {
            background: #fff;
            color: #2F2C38;
        }
        .muc:hover .lien-ket-muc {
            color: #2F2C38;
        }
        .logo {
            width: 50px;
            height: 30px;
        }
        .avata {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            object-fit: cover;
        }
        .dang-chon {
            color: #fff;
            background: #2F2C38;
        }
        .banner {
            width: 95%;
            border-radius: 20px;
            margin: 20px auto;
        }
        .banner-anh {
            width: 100%;
            height: 320px;
            object-fit: cover;
            border-radius: 20px;
            display: block;
        }
        .danh-sach-the-loai {
            width: 95%;
            margin: 20px auto 10px;
            display: flex;
            gap: 20px;
            align-items: baseline;
        }
        .the-loai {
            font-size: 14px;
            color: #bbb;
        }
        .ten-loai {
            font-size: 22px;
            font-weight: bold;
        }
        .danh-sach-phim {
            width: 95%;
            margin: 0 auto 30px;
        }
        .phim {
            display: flex;
            gap: 14px;
            align-items: flex-start;
            overflow-x: auto;
            padding-bottom: 8px;
        }
        .phim-poster {
            width: 140px;
            height: 200px;
            object-fit: cover;
            border-radius: 15px;
            flex-shrink: 0;
            background: #1a1820;
        }
        .phim-poster:hover {
            outline: 2px solid #fff;
        }
    </style>
</head>
<body>
    <header>
        <nav class="danh-muc">
            <ul class="danh-sach-muc">
                <li class="muc"><a class="lien-ket-muc" href="#"><img src="../Anh/logo.svg" alt="Logo" class="logo"></a></li>
                <li class="muc"><a class="lien-ket-muc" href="#">Trang chủ</a></li>
                <li class="muc"><a class="lien-ket-muc" href="#">Nhân vật</a></li>
                <li class="muc"><a class="lien-ket-muc" href="#">Series</a></li>
                <li class="muc"><a class="lien-ket-muc" href="#">Phim</a></li>
                <li class="muc"><a class="lien-ket-muc" href="#">Mới & phổ biến</a></li>
                <li class="muc"><a class="lien-ket-muc" href="#">Netflix của tôi</a></li>
                <li class="muc"><a class="lien-ket-muc" href="#">Duyệt tìm theo ngôn ngữ</a></li>
            </ul>
        </nav>
        <div class="chuc-nang">
            <div class="tim-kiem"></div>
            <div class="thong-tin">
                <img src="../Anh/avata.jpg" alt="Avata" class="avata">
            </div>
        </div>
    </header>

    <main>
        <div class="banner">

        </div>

        <div class="danh-sach-the-loai">
            <div class="the-loai">Gợi ý</div>
            <div class="ten-loai">Có thể bạn chưa xem</div>
        </div>
        <div class="danh-sach-phim">
            <div class="phim">
                <img src="../Anh/phim01.jpg" alt="Hải Mộ Tầm Long" class="phim-poster">
                <img src="../Anh/phim02.jpg" alt="Những Ngả Đường Ước Mơ" class="phim-poster">
                <img src="../Anh/phim03.jpg" alt="Đứa Con Của Riêng Tôi" class="phim-poster">

        </div>
        <div class="danh-sach-phim">

                <img src="../Anh/phim38.jpg" alt="Your Name" class="phim-poster">
            </div>
        </div>

        <div class="danh-sach-the-loai">
            <div class="the-loai">Hài hước</div>
            <div class="ten-loai">Phim hài</div>
        </div>
        <div class="danh-sach-phim">
            <div class="phim">
                <img src="../Anh/phim39.jpg" alt="Deadpool" class="phim-poster">

        </div>

        <div class="danh-sach-the-loai">
            <div class="the-loai">Hoạt hình</div>
            <div class="ten-loai">Phim hoạt hình</div>
        </div>
        <div class="danh-sach-phim">
            <div class="phim">
                <img src="../Anh/phim47.jpg" alt="Frozen" class="phim-poster">
                <img src="../Anh/phim48.jpg" alt="Encanto" class="phim-poster">

            </div>
        </div>
    </main>
</body>
</html>
