<!DOCTYPE html>

    <title>Web phim</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            color: #fff;
            background: #2F2C38;
        }
        .danh-sach-muc {
            list-style: none;
            display: flex;
            gap:20px;
            align-items: center;
        }
        .lien-ket-muc {
            color: #fff;
            text-decoration: none;
        } 
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .muc {
            padding: 10px;
            border-radius: 25px;
        }
        .muc:hover {
            background: #fff;
            color: #2F2C38;
        }
        .logo {
            width: 50px;
            height: 30px;
        }
        .avata {
            width: 80%;
            border-radius: 10px;
        }
        .dang-chon {
            color: #fff;
            background: #2F2C38;
        }
        .banner {
            width: 95%;
            border-radius: 20px;
            margin:20px auto;
        }
        .banner-anh {
            width: 100%;
            height: 100%;
            border-radius: 20px;
        }
        .danh-sach-the-loai {
            width: 95%;
            display: flex;
            gap: 20px;
            justify-content: center;
        }
        .phim {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .phim-poster {
            width: 24%;
            height: 15vh;
            border-radius: 15px;
        }
    </style>
</head>
