<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body { background: #fff; color: #111; font-family: Arial, sans-serif; }
        .chu { font-weight: bold; margin-left: 8px; }
    </style>
</head>
<body>
    <script>
        // function
        function xinChao(){
            document.write("<br>xin chào");
        }
        xinChao();
        // function với tham số
        function xinChao(ten){
            document.write("<br>xin chào "+ten);
        }
        xinChao("Duy Hoàng");
        xinChao( "Phuong");
        // sử dụng function với popup box tính tổng của 2 số và trước khi tính phải kiểm tra đó có phải là số không
        function tinhTong(so1, so2){
            
            if(isNaN(so1)==false && isNaN(so2)==false){
                alert("Vui lòng nhập số");
                so1 = prompt("nhập số thứ nhất");
                so2 = prompt("nhập số thứ hai");
                return so1 + so2;
            }
            return so1 + so2;
        }
        var tong = tinhTong();
        document.write("<br>Tổng của 2 số là: "+tinhTong);
        // hàm quy đổi điểm hệ 10 sang điểm chữ
        function diemChu(diem){
            if(diem >= 9 && diem <= 10){
                return "A+";
            }
            if(diem >= 8.5 && diem < 9){
                return "A";
            }
            if(diem >= 8 && diem < 8.5){
                return "B+";
            }
            if(diem >= 7 && diem < 8){
                return "B";
            }
            if(diem >= 6.5 && diem < 7){
                return "C+";
            }
            if(diem >= 5.5 && diem < 6.5){
                return "C";
            }
            if(diem >= 5 && diem < 5.5){
                return "D+";
            }
            if(diem >= 4 && diem < 5){
                return "D";
            }
            if(diem >= 0 && diem < 4){
                return "F";
            }
            return "Không hợp lệ";
        }
        // lấy số từ ô nhập, chấp nhận dấu phẩy
        function layDiem(giaTri){
            if(giaTri == ""){
                return "";
            }
            var diem = parseFloat(String(giaTri).replace(",", "."));
            if(isNaN(diem)==true || diem < 0 || diem > 10){
                return null;
            }
            return diem;
        }
        // hiện điểm chữ bên cạnh một ô nhập
        function hienDiemChu(idDiem, idChu){
            var diem = layDiem(document.getElementById(idDiem).value);
            if(diem === ""){
                document.getElementById(idChu).innerHTML = "";
                return "";
            }
            if(diem == null){
                document.getElementById(idChu).innerHTML = "Không hợp lệ";
                return null;
            }
            document.getElementById(idChu).innerHTML = diemChu(diem);
            return diem;
        }
        // hàm nhập điểm A, B, C, in điểm chữ bên cạnh và tính điểm tổng = A*0.6 + B*0.3 + C*0.1
        function tinhDiemTong(){
            var diemA = hienDiemChu("diemA", "chuA");
            var diemB = hienDiemChu("diemB", "chuB");
            var diemC = hienDiemChu("diemC", "chuC");
            if(diemA === "" || diemB === "" || diemC === "" || diemA == null || diemB == null || diemC == null){
                document.getElementById("ketQuaTong").innerHTML = "";
                return;
            }
            var tongDiem = diemA*0.6 + diemB*0.3 + diemC*0.1;
            document.getElementById("ketQuaTong").innerHTML = tongDiem + " - Điểm chữ: " + diemChu(tongDiem);
        }
        // in ra màn hình 
        document.write("Hello World ");
        var ten = "Duy ";
        ten = "Duy ";
        document.write("<br>" + ten);
        
        var nam = 2026;
        document.write("<br>Year: " + nam);
        // phep toan
        // phep cong
        var a = 10;
        var b = 20;
        var tong = a + b;
        document.write("<br>Tong: " + tong);
        // phep tru
        var hieu = a - b;
        document.write("<br>Hieu: " + hieu);
        // phep nhan
        var tich = a * b;
        document.write("<br>Tich: " + tich);
        // phep chia
        var thuong = a / b;
        document.write("<br>Thuong: " + thuong);
        // %
        var phanTram = a % b;
        document.write("<br>Phan Tram: " + phanTram);
        //++
        document.writeln("<br>" );
        document.writeln(++ a);
        // -- tuong tu ++
        a+=b;
        document.writeln("<br>");
        document.writeln(a);
        a-=b;
        document.writeln("<br>");
        document.writeln(a);
        var ho = "Hoang";
        document.writeln("<br>"+ ho+ " "+ten );
        document.writeln("<br>" );
        document.writeln(ho.length );
        document.writeln("<br>" );
        // typeof kiem tra kieu du lieu
        document.writeln(typeof(ho ));
        document.writeln("<br>" );
        // indexOf tim vi tri cua ky tu trong chuoi
        var hoTen = " Hoang Manh Duy";
        document.writeln(hoTen.indexOf("D") );
        document.writeln("<br>" );
        // includes kiem tra chuoi co chua ky tu hay khong
        document.writeln(hoTen.includes("P") );
        document.writeln("<br>" );
        document.writeln(hoTen.startsWith("H") );
        document.writeln("<br>" );
        document.writeln(hoTen.replace("Duy", "Phuong") );
        document.writeln("<br>" );
        // toUpperCase chuyen chuoi thanh chu in hoa
        document.writeln(hoTen.toUpperCase() );
        document.writeln("<br>" );
        // toLocaleLowerCase chuyen chuoi thanh chu thuong
        document.writeln(hoTen.toLocaleLowerCase() );
        // date
       // hàm date:
        var toDay = new Date();
        document.writeln("<br>"+toDay);
        var ngay = new Date("8/6/2025");
        document.writeln("<br>"+ngay);

        var namnay = toDay.getFullYear();
        document.write("<br>"+namnay);

        var thangnay = toDay.getMonth();
        document.write("<br>"+thangnay);
        var homnay = toDay.getDate();
        document.write("<br>"+thangnay);
        var thu = toDay.getDay()+1;
        document.write("<br>Hôm nay là thứ "+thu+" ngày "+homnay+" tháng "+thangnay+" năm "+namnay);
        // mảng
        // khai báo
        var mangso = [1,2,3,4,5];
        document.writeln("<br>"+mangso[2]);
        document.writeln("<br>"+mangso.length);

        var mangten = ["Duy", "Phuong", "Hoang Manh"]
        document.writeln("<br>"+mangten[2]);

        var mang = [1,2,3,4,5,"Duy", "Phuong", "Hoang Manh"]
        document.writeln("<br>"+mang[5]);

        // phương thức của array
        var d = mang.concat(mangso, mangten);
        document.writeln("<br>"+d);
        document.writeln("<br>"+d.join(" - "));
        document.writeln("<br>"+d.pop());
        d.push("Duy");
        document.write("<br>"+mangso.reverse());
        //Object
        var thongTin = {
            name: "Duy",
            namSinh: 2006,
            city: "Ninh Binh",
            gioiTinh: true
        }
        // truy cập thông tin của object
        document.writeln("<br>"+thongTin.name);
        document.writeln("<br>"+thongTin.namSinh);
        document.writeln("<br>"+thongTin.city);
        tuoi = namnay - thongTin.namSinh;
        thongTin.tuoi = tuoi;
        // console log
        
        thongTin.gioiTinh = true;
        var danhSachSinhVien = [
            {
                name: "Phuong",
                namSinh: 2006,
                city: "Ha Noi"
            },
            {
                name: "Hoang Manh",
                namSinh: 2005,
                city: "Nam Dinh"
            }
        ];
        document.writeln("<br>" + danhSachSinhVien[0].name + " - " + danhSachSinhVien[0].namSinh + " - " + danhSachSinhVien[0].city);
        document.writeln("<br>" + danhSachSinhVien[1].name + " - " + danhSachSinhVien[1].namSinh + " - " + danhSachSinhVien[1].city);
    
        // ==
        var so1 = 10;
        var so2 = "10";
        document.writeln("<br>" + (so1 == so2)); 
        // === kiểm tra giá trị và kiểu dữ liệu
        document.writeln("<br>" + (so1 === so2));
        if(thu >= 7){
            document.writeln("<br>Hôm nay được nghỉ");
        }else if(thu == 6){
            document.writeln("<br>tối nay đi chơi");
        }else{
            document.writeln("<br>Hôm nay ko được nghỉ");
        }
        // tìm số chẵn lẻ bất kì
        // var so = 3333333333333333333333333333333n;
        // var dodai = so.toString().length;
        // var soCuoi = so.toString()[dodai - 1];
        // if(soCuoi % 2n === 0n){
        //     document.writeln("<br>Số " + so + " có " + dodai + " chữ số và là số chẵn");
        // }else{
        //     document.writeln("<br>Số " + so + " có " + dodai + " chữ số và là số lẻ");
        // }
        document.writeln("<br>------------------------------------------------------------------------------");
        // switch case
        var day = new Date().getDay();
        switch(day){
            case 0:
                document.writeln("<br>Hôm nay là chủ nhật");
                break;
            case 5:
                document.writeln("<br>Hôm nay là thứ sáu");
                break;
            case 6:
                document.writeln("<br>Hôm nay là thứ bảy");
                break;
            default:
                document.writeln("<br>Không phải là thứ trong tuần");
        }
        // for
        for(var index = 1; index <= 10; index++){
            document.writeln("<br>");
            document.writeln("<br>Duy Hoàng"+index);
        }
        // mang với for
        for(var mangso = 0; mangso < mangso.length; mangso++){
            document.writeln("<br>");
            document.writeln("<br>Duy Hoàng"+mangso);
        } 
        // cho vong lập for với if và else lọc mảng nếu là chữ số thì in ra xin chào và nếu là chữ thì in chữ đấy
        for(var mang = 0; mang < mang.length; mang++){
            if(mang % 2 == 0){
                document.writeln("<br>Duy Hoàng"+mang);
            }else{
                document.writeln("<br>Duy Hoàng"+mang);
            }
        }
        // while
        var index = 1;
        while(index <= 10){
            document.writeln("<br>");
            document.writeln("<br>bạn thật tuyệt vời"+index);
            index++;
        }
        // do while
        var index = 1;
        do{
            document.writeln("<br>");
            document.writeln("<br> xin chào "+index);
            index++;
        }while(index <= 10);
        // popup boxex alert, confirm, prompt
        alert("xin chào");

       var i= confirm("bạn có muốn thoát không");
       if(i){
        document.write("<br>bạn đã thoát");
       }else{
        document.write("<br>bạn đã không thoát");
       }
        var r=prompt("nhập tên của bạn");
        document.write("<br>"+r);
        // function
        function xinChao(){
            document.write("<br>xin chào");
        }
        xinChao();
        // function với tham số
        function xinChao(ten){
            document.write("<br>xin chào "+ten);
        }
        // bai lam ve nha
        //chuyển chuỗi thành số bằng parseFloat,isNaN,isFinite,parseFloat,parseInt
        function diem(A,B,C){
            var cal = A*0.6+B*0.3+C*0.1;
            var diemChu = "";
            var xepLoai = "";
            var diemHe4 = "";
            if (cal < 0 || cal > 10) {
                document.write("Điểm không hợp lệ!");
            } else if (cal >= 9.0) {
                diemChu = "A+"; diemHe4 = 4.0; xepLoai = "Đạt";
            } else if (cal >= 8.5) {
                diemChu = "A";  diemHe4 = 3.7; xepLoai = "Đạt";
            } else if (cal >= 8.0) {
                diemChu = "B+"; diemHe4 = 3.5; xepLoai = "Đạt";
            } else if (cal >= 7.0) {
                diemChu = "B";  diemHe4 = 3.0; xepLoai = "Đạt";
            } else if (cal >= 6.5) {
                diemChu = "C+"; diemHe4 = 2.5; xepLoai = "Đạt";
            } else if (cal >= 5.5) {
                diemChu = "C";  diemHe4 = 2.0; xepLoai = "Đạt";
            } else if (cal >= 5.0) {
                diemChu = "D+"; diemHe4 = 1.5; xepLoai = "Đạt";
            } else if (cal >= 4.0) {
                diemChu = "D";  diemHe4 = 1.0; xepLoai = "Đạt";
            } else {
                diemChu = "F";  diemHe4 = 0;   xepLoai = "Không đạt";
            }
            return "Điểm hệ 10: "+cal+" || Điểm hệ 4: "+diemHe4+" || Điểm chữ: "+diemChu+" || Xếp loại: "+xepLoai;
        }
        var A = Number(prompt("Nhập điểm A: ","Nhập ở đây!"));
        var B = Number(prompt("Nhập điểm B: ","Nhập ở đây!"));
        var C = Number(prompt("Nhập điểm C: ","Nhập ở đây!"));
        document.write("<br>"+diem(A,B,C));
    </script>

    <h3>Nhập điểm</h3>
    <p>Điểm A: <input type="text" id="diemA" oninput="tinhDiemTong()"> <span class="chu" id="chuA"></span></p>
    <p>Điểm B: <input type="text" id="diemB" oninput="tinhDiemTong()"> <span class="chu" id="chuB"></span></p>
    <p>Điểm C: <input type="text" id="diemC" oninput="tinhDiemTong()"> <span class="chu" id="chuC"></span></p>
    <p>Điểm tổng = A*0.6 + B*0.3 + C*0.1: <span class="chu" id="ketQuaTong"></span></p>
</body>
</html>
